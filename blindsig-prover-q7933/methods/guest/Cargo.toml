[package]
name = "q7933_guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "^3.0.6", default-features = false, features = ['std'] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
prover-core = { path = "../../prover-core" }
# PHASE 2 EMPIRICAL GATE ONLY (src/bin/ntt_bench_q12289.rs): a read-only
# path dependency on the EXISTING, untouched q=12289 sibling crate, purely
# to get a true apples-to-apples cycle-count comparison (same benchmark
# shape, same N=512, different multiplication algorithm) - see that file's
# own comment. Renamed via `package =` since both crates are named
# "prover-core".
prover-core-q12289 = { path = "../../../blindsig-prover/prover-core", package = "prover-core" }
