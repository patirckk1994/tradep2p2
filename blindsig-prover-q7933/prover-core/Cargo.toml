[package]
name = "prover-core"
# Deliberately NOT 0.1.0: the q=12289 sibling crate is also named
# "prover-core" at 0.1.0, and the Phase 2 benchmark guest
# (methods/guest/src/bin/ntt_bench_q12289.rs) depends on BOTH crates at
# once (via a `package =` rename) for a true apples-to-apples cycle-count
# comparison - Cargo's lockfile disambiguates path dependencies by
# (name, version, source), so an identical (name, version) pair for two
# genuinely different crates is a real collision, not a cosmetic one.
version = "0.2.0"
edition = "2021"

# Same reasoning as blindsig-prover/prover-core (the q=12289 sibling): this
# crate deliberately has NO dependency on risc0-zkvm, since it's compiled
# for two different targets by two different callers - the RISC0 guest
# (methods/guest, riscv32im-risc0-zkvm-elf) and the native host CLI
# (prover, the machine's own target) - holding the SAME compiled logic for
# both is the entire point: what the client computes and what the guest
# later re-derives and checks must be the identical function.
[dependencies]
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
rand = "0.8"
